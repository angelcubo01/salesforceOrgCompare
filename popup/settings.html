<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ajustes · Salesforce Org Compare</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="settings-shell">
      <header class="settings-header">
        <h1 class="settings-title" data-i18n="settings.title">Ajustes</h1>
        <p class="settings-lead" data-i18n="settings.subtitle"></p>
      </header>

      <main class="settings-main">
        <section class="settings-card" aria-labelledby="settings-general-heading">
          <h2 id="settings-general-heading" class="settings-card-title" data-i18n="settings.sectionGeneral">
            General
          </h2>
          <label class="settings-label" for="settingsLang" data-i18n="settings.language">Idioma</label>
          <select id="settingsLang" class="settings-select"></select>
          <p class="settings-hint" data-i18n="settings.languageHint"></p>
          <label class="settings-label" for="settingsUiTheme" data-i18n="settings.uiTheme"></label>
          <select id="settingsUiTheme" class="settings-select settings-select--full"></select>
          <p class="settings-hint" data-i18n="settings.uiThemeHint"></p>
          <label class="settings-label" for="settingsMonacoTheme" data-i18n="settings.monacoTheme"></label>
          <select id="settingsMonacoTheme" class="settings-select settings-select--full"></select>
          <p class="settings-hint" data-i18n="settings.monacoThemeHint"></p>
          <label class="settings-label" for="settingsApexCoverageMinPercent" id="settingsApexCoverageMinPercent_label"></label>
          <input
            type="number"
            id="settingsApexCoverageMinPercent"
            class="settings-number settings-number--wide"
            min="0"
            max="100"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsApexCoverageMinPercent_hint"></p>
          <label class="settings-label" for="settingsOrgLimitsWarningPercent" id="settingsOrgLimitsWarningPercent_label"></label>
          <input
            type="number"
            id="settingsOrgLimitsWarningPercent"
            class="settings-number settings-number--wide"
            min="0"
            max="100"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsOrgLimitsWarningPercent_hint"></p>
          <label class="settings-label" for="settingsApexTraceDebugLevel" id="settingsApexTraceDebugLevel_label"></label>
          <input
            type="text"
            id="settingsApexTraceDebugLevel"
            class="settings-text settings-text--wide"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="settings-hint" id="settingsApexTraceDebugLevel_hint"></p>
          <label class="settings-label" for="settingsDebugLogsDefaultRangeHours" id="settingsDebugLogsDefaultRangeHours_label"></label>
          <input
            type="number"
            id="settingsDebugLogsDefaultRangeHours"
            class="settings-number settings-number--wide"
            min="1"
            max="168"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsDebugLogsDefaultRangeHours_hint"></p>
          <label class="settings-label" for="settingsSetupAuditDefaultRangeHours" id="settingsSetupAuditDefaultRangeHours_label"></label>
          <input
            type="number"
            id="settingsSetupAuditDefaultRangeHours"
            class="settings-number settings-number--wide"
            min="1"
            max="168"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsSetupAuditDefaultRangeHours_hint"></p>
          <label class="settings-label" for="settingsFieldHistoryDefaultRangeDays" id="settingsFieldHistoryDefaultRangeDays_label"></label>
          <input
            type="number"
            id="settingsFieldHistoryDefaultRangeDays"
            class="settings-number settings-number--wide"
            min="1"
            max="90"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsFieldHistoryDefaultRangeDays_hint"></p>
          <label class="settings-label" for="settingsCodeEditorMaxTabs" id="settingsCodeEditorMaxTabs_label"></label>
          <input
            type="number"
            id="settingsCodeEditorMaxTabs"
            class="settings-number settings-number--wide"
            min="3"
            max="30"
            step="1"
            inputmode="numeric"
          />
          <p class="settings-hint" id="settingsCodeEditorMaxTabs_hint"></p>
          <label class="settings-checkbox-row">
            <input type="checkbox" id="settingsTelemetryEnabled" checked />
            <span data-i18n="settings.telemetryEnabled">Enviar telemetría anónima de uso</span>
          </label>
          <p class="settings-hint" data-i18n="settings.telemetryEnabledHint"></p>
          <label class="settings-checkbox-row">
            <input type="checkbox" id="settingsCodeEditorPersistEnabled" checked />
            <span data-i18n="settings.codeEditorPersistEnabled">Recordar tu trabajo en Quick Edit y editores Apex y Lightning</span>
          </label>
          <p class="settings-hint" data-i18n="settings.codeEditorPersistEnabledHint"></p>
          <div class="settings-btn-row">
            <button
              type="button"
              id="settingsGeneralTraceSave"
              class="settings-secondary"
              data-i18n="settings.advancedSaveAll"
            >
              Guardar
            </button>
          </div>
          <p id="settingsGeneralTraceStatus" class="settings-status" role="status"></p>
        </section>

        <section class="settings-card" id="settingsSfInject" aria-labelledby="settings-sfinject-heading">
          <h2 id="settings-sfinject-heading" class="settings-card-title settings-card-title--with-badge">
            <span data-i18n="settings.sectionSfInject">Salesforce UI Integration</span>
            <span class="settings-beta-badge" data-i18n="settings.sfInjectBeta">Beta</span>
          </h2>
          <p class="settings-hint settings-hint--nomargin" data-i18n="settings.sfInjectLead"></p>
          <label class="settings-checkbox-row">
            <input type="checkbox" id="settingsSfInjectEnabled" />
            <span data-i18n="settings.sfInjectEnabled">Activar integración UI en Salesforce</span>
          </label>
          <p class="settings-hint" data-i18n="settings.sfInjectEnabledHint"></p>
          <div class="settings-sf-inject-integrations" role="group" aria-labelledby="settings-sfinject-integrations-heading">
            <h3 id="settings-sfinject-integrations-heading" class="settings-subheading" data-i18n="settings.sfInjectIntegrationsTitle">
              Integraciones
            </h3>
            <p class="settings-hint settings-hint--nomargin" data-i18n="settings.sfInjectIntegrationsHint"></p>
            <div id="settingsSfInjectIntegrations"></div>
          </div>
          <p id="settingsSfInjectStatus" class="settings-status" role="status"></p>
        </section>

        <section class="settings-card" id="settingsLogi" hidden aria-labelledby="settings-logi-heading">
          <h2 id="settings-logi-heading" class="settings-card-title" data-i18n="settings.logi.sectionTitle">Logi · IA</h2>
          <p class="settings-hint settings-hint--nomargin" data-i18n="settings.logi.lead"></p>
          <label class="settings-label" for="settingsLogiLanguage" data-i18n="settings.logi.language"></label>
          <select id="settingsLogiLanguage" class="settings-logi-select settings-select--full"></select>
          <p class="settings-hint" data-i18n="settings.logi.languageHint"></p>
          <div id="settingsLogiUsage" class="settings-logi-usage" hidden>
            <h3 class="settings-logi-usage-title" data-i18n="settings.logi.usageTitle">Uso</h3>
            <p class="settings-hint settings-hint--nomargin" data-i18n="settings.logi.usageHint"></p>
            <div class="settings-logi-usage-list" id="settingsLogiUsageList"></div>
          </div>
          <div id="settingsLogiModes" class="settings-logi-modes"></div>
          <div id="settingsLogiByokPanel" class="settings-logi-panel" hidden>
            <label class="settings-label" for="settingsLogiByokKey" data-i18n="settings.logi.byokKey"></label>
            <input type="password" id="settingsLogiByokKey" class="settings-text settings-text--wide settings-logi-input" autocomplete="off" spellcheck="false" />
            <p class="settings-hint" data-i18n="settings.logi.byokKeyHint"></p>
            <label class="settings-label" data-i18n="settings.logi.byokModels"></label>
            <p class="settings-hint" data-i18n="settings.logi.byokModelsHint"></p>
            <p class="settings-hint settings-hint--nomargin" id="settingsLogiByokModelsPricingHint" hidden data-i18n="settings.logi.byokModelsPricingHint"></p>
            <div id="settingsLogiByokModelsList" class="settings-logi-models" role="list"></div>
            <div class="settings-logi-models-add">
              <select id="settingsLogiByokModelAdd" class="settings-logi-select" aria-label=""></select>
              <button type="button" id="settingsLogiByokModelAddBtn" class="settings-secondary" data-i18n="settings.logi.byokModelsAdd"></button>
            </div>
            <div class="settings-btn-row">
              <button type="button" id="settingsLogiTestByok" class="settings-secondary" data-i18n="settings.logi.testByok"></button>
            </div>
          </div>
          <div class="settings-btn-row">
            <button type="button" id="settingsLogiSave" class="settings-secondary" data-i18n="settings.advancedSaveAll"></button>
          </div>
          <p id="settingsLogiStatus" class="settings-status" role="status"></p>
        </section>

        <section class="settings-card" aria-labelledby="settings-orgs-heading">
          <h2 id="settings-orgs-heading" class="settings-card-title" data-i18n="settings.sectionBackup">
            Copia de seguridad
          </h2>
          <p class="settings-hint settings-hint--nomargin" data-i18n="settings.backupHint"></p>
          <div class="settings-btn-row">
            <button type="button" id="settingsExportOrgs" class="settings-secondary" data-i18n="settings.backupExport">
              Exportar copia
            </button>
            <button type="button" id="settingsImportReplace" class="settings-secondary" data-i18n="settings.backupImportReplace">
              Importar (sustituir todo)
            </button>
          </div>
          <input type="file" id="settingsOrgsFile" class="visually-hidden" accept=".json,application/json" />
          <p id="settingsOrgsStatus" class="settings-status" role="status"></p>
        </section>

        <details class="settings-advanced" id="settingsAdvanced">
          <summary class="settings-advanced-summary">
            <span data-i18n="settings.advancedSummary">Avanzado · límites técnicos</span>
          </summary>
          <div class="settings-advanced-inner">
            <p class="settings-hint settings-hint--nomargin" data-i18n="settings.advancedLead"></p>
            <div id="settingsAdvancedFields" class="settings-advanced-fields"></div>
            <div class="settings-btn-row">
              <button type="button" id="settingsAdvancedSave" class="settings-secondary" data-i18n="settings.advancedSaveAll">
                Guardar
              </button>
              <button type="button" id="settingsAdvancedReset" class="settings-secondary" data-i18n="settings.advancedResetAll">
                Valores por defecto
              </button>
            </div>
            <p id="settingsAdvancedStatus" class="settings-status" role="status"></p>
          </div>
        </details>

        <section class="settings-card" aria-labelledby="settings-about-heading">
          <h2 id="settings-about-heading" class="settings-card-title" data-i18n="settings.sectionAbout">
            Acerca de
          </h2>
          <p class="settings-version-row">
            <span data-i18n="settings.versionLabel">Versión instalada</span>
            <strong id="settingsVersion" class="settings-version-value">—</strong>
          </p>
          <div class="settings-install-id">
            <p class="settings-version-row settings-version-row--install">
              <span data-i18n="settings.userIdLabel">ID de instalación</span>
              <strong id="settingsTelemetryUserId" class="settings-version-value settings-install-id-value" title="">—</strong>
              <button
                type="button"
                id="settingsCopyInstallId"
                class="settings-secondary settings-copy-id"
                data-i18n="settings.userIdCopy"
              >
                Copiar
              </button>
            </p>
            <p id="settingsCopyInstallIdStatus" class="settings-status" role="status" aria-live="polite"></p>
          </div>
          <div class="settings-links">
            <a
              id="settingsHomeLink"
              class="settings-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="settings.projectPage"
              >Web</a
            >
            <span class="settings-links-sep" aria-hidden="true">·</span>
            <a
              id="settingsPrivacyLink"
              class="settings-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="settings.privacy"
              >Privacidad</a
            >
            <span class="settings-links-sep" aria-hidden="true">·</span>
            <a
              class="settings-link"
              href="https://es.linkedin.com/in/angelcubo01"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="settings.linkedIn"
              >LinkedIn</a
            >
          </div>
        </section>

      </main>
    </div>
    <script type="module" src="./settings.js"></script>
  </body>
</html>
