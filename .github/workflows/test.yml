name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Ensure telemetry config stub for CI
        run: |
          if [ ! -f shared/telemetryConfig.js ]; then
            cp shared/telemetryConfig.example.js shared/telemetryConfig.js
          fi

      - run: npm test
