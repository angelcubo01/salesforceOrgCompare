<!doctype html>
<html lang="es" data-sfoc-document="apex-source-viewer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Código Apex · Salesforce Org Compare</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/icon-16.png" />
    <link rel="stylesheet" href="../vendor/monaco-editor/min/vs/editor/editor.main.css" />
    <link rel="stylesheet" href="./apex-source-viewer.css" />
    <link rel="stylesheet" href="../shared/sfoc-design-system.css" />
  </head>
  <body>
    <header class="apex-src-viewer-toolbar">
      <button type="button" id="apexSrcViewerBack" class="apex-src-viewer-back" data-i18n="apexLogViewer.back">
        Volver
      </button>
      <img class="sfoc-viewer-brand-logo" src="../icons/icon-32.png" width="32" height="32" alt="" aria-hidden="true" />
      <span id="apexSrcViewerTitle" class="apex-src-viewer-title"></span>
      <span id="apexSrcViewerOrg" class="apex-src-viewer-org" hidden></span>
      <button
        type="button"
        id="apexSrcViewerDownload"
        class="apex-src-viewer-download"
        data-i18n="apexLogViewer.download"
      >
        Descargar
      </button>
    </header>
    <div id="apexSrcViewerTabs" class="apex-src-viewer-tabs" role="tablist" aria-label="Clases Apex abiertas"></div>
    <div id="apexSrcViewerLive" class="apex-src-viewer-live" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="apexSrcViewerError" class="apex-src-viewer-error-state" role="alert" hidden></div>
    <div id="apexSrcViewerEmpty" class="apex-src-viewer-empty" hidden>
      <p>No hay clases abiertas</p>
      <button type="button" id="apexSrcViewerEmptyBack">Volver</button>
    </div>
    <div id="apexSrcViewerMount" class="apex-src-viewer-editor"></div>
    <script src="../vendor/monaco-editor/min/vs/loader.js"></script>
    <script src="./editor/monaco-amd-config.js"></script>
    <script type="module" src="./apex-source-viewer.js"></script>
  </body>
</html>
