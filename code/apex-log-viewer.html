<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log Apex · Salesforce Org Compare</title>
    <link rel="stylesheet" href="../vendor/monaco-editor/min/vs/editor/editor.main.css" />
    <link rel="stylesheet" href="./apex-log-viewer.css" />
  </head>
  <body>
    <header class="apex-log-viewer-toolbar">
      <button type="button" id="apexLogViewerBack" class="apex-log-viewer-back" data-i18n="apexLogViewer.back">
        Volver
      </button>
      <span id="apexLogViewerTitle" class="apex-log-viewer-title"></span>
      <span id="apexLogViewerMeta" class="apex-log-viewer-meta" hidden></span>
      <span id="apexLogViewerContext" class="apex-log-viewer-context" hidden></span>
      <span id="apexLogViewerParsing" class="apex-log-viewer-parsing" hidden data-i18n="apexLogViewer.parsing"
        >Analizando…</span
      >
      <button
        type="button"
        id="apexLogViewerDownload"
        class="apex-log-viewer-download"
        data-i18n="apexLogViewer.download"
        hidden
      >
        Descargar
      </button>
    </header>
    <nav id="apexLogTabs" class="apex-log-tabs" role="tablist" aria-label="Vistas del log"></nav>
    <main class="apex-log-panels">
      <div class="apex-log-panel is-active" data-panel="text">
        <div id="apexLogViewerMount" class="apex-log-viewer-editor"></div>
      </div>
      <div class="apex-log-panel" data-panel="tree" hidden>
        <div id="apexLogTreeMount" class="apex-log-viewer-editor"></div>
      </div>
      <div class="apex-log-panel" data-panel="debug" hidden>
        <div id="apexLogDebugMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="timeline" hidden>
        <div id="apexLogTimelineMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="soql" hidden>
        <div id="apexLogSoqlMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="dml" hidden>
        <div id="apexLogDmlMount" class="apex-log-panel-scroll"></div>
      </div>
    </main>
    <script src="../vendor/monaco-editor/min/vs/loader.js"></script>
    <script src="./editor/monaco-amd-config.js"></script>
    <script type="module" src="./apex-log-viewer.js"></script>
  </body>
</html>
