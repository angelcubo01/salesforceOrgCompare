<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log Apex · Salesforce Org Compare</title>
    <link rel="stylesheet" href="../vendor/monaco-editor/min/vs/editor/editor.main.css" />
    <link rel="stylesheet" href="./apex-log-viewer.css" />
  </head>
  <body>
    <header class="apex-log-viewer-toolbar">
      <div class="apex-log-viewer-toolbar-row apex-log-viewer-toolbar-row--primary">
        <button type="button" id="apexLogViewerBack" class="apex-log-viewer-back" data-i18n="apexLogViewer.back">
          Volver
        </button>
        <span id="apexLogViewerTitle" class="apex-log-viewer-title"></span>
        <span id="apexLogViewerMeta" class="apex-log-viewer-meta" hidden></span>
        <span id="apexLogViewerName" class="apex-log-viewer-name" hidden></span>
        <span id="apexLogExecutionBadge" class="apex-log-viewer-meta" hidden></span>
        <span id="apexLogViewerParsing" class="apex-log-viewer-parsing" hidden></span>
      </div>
      <div class="apex-log-viewer-toolbar-row apex-log-viewer-toolbar-row--secondary">
        <div id="apexLogFindMount" class="apex-log-find-mount"></div>
        <span class="apex-log-viewer-toolbar-spacer" aria-hidden="true"></span>
        <button
          type="button"
          id="apexLogViewerDownload"
          class="apex-log-viewer-download"
          data-i18n="apexLogViewer.download"
          hidden
        >
          Descargar
        </button>
        <span
          id="apexLogViewerUser"
          class="apex-log-viewer-user ph-no-capture"
          hidden
          role="img"
        ></span>
      </div>
    </header>
    <nav id="apexLogTabs" class="apex-log-tabs" role="tablist" data-i18n-aria-label="apexLogViewer.tabListAria"></nav>
    <div id="apexLogExecutionMount" class="apex-log-execution-mount" hidden></div>
    <div id="apexLogViewerLoading" class="apex-log-viewer-loading" hidden>
      <div class="apex-log-viewer-loading-inner">
        <div class="apex-log-viewer-loading-spinner" aria-hidden="true"></div>
        <span data-i18n="apexLogViewer.loading">Cargando log…</span>
      </div>
    </div>
    <main class="apex-log-panels">
      <div class="apex-log-panel is-active" data-panel="summary">
        <div id="apexLogSummaryMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="errors" hidden>
        <div id="apexLogErrorsMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="text" hidden>
        <div id="apexLogTextToolbar" class="apex-log-text-toolbar"></div>
        <span id="apexLogTextFilterCount" class="apex-log-text-filter-count"></span>
        <div id="apexLogViewerMount" class="apex-log-viewer-editor"></div>
      </div>
      <div class="apex-log-panel" data-panel="timeline" hidden>
        <div id="apexLogTimelineToolbar" class="apex-log-panel-toolbar"></div>
        <div id="apexLogTimelineMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="database" hidden>
        <div id="apexLogDatabaseMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="analysis" hidden>
        <div id="apexLogAnalysisMount" class="apex-log-panel-scroll apex-log-panel-scroll--analysis"></div>
      </div>
      <div class="apex-log-panel" data-panel="network" hidden>
        <div id="apexLogNetworkMount" class="apex-log-panel-scroll"></div>
      </div>
      <div class="apex-log-panel" data-panel="platform" hidden>
        <div id="apexLogPlatformMount" class="apex-log-panel-scroll"></div>
      </div>
    </main>
    <script src="../vendor/monaco-editor/min/vs/loader.js"></script>
    <script src="./editor/monaco-amd-config.js"></script>
    <script type="module" src="./apex-log-viewer.js"></script>
  </body>
</html>
